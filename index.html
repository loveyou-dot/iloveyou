<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>وێبسایتی خۆشەویستی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0, #fce4ec);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333333;
            overflow: hidden;
            position: relative;
        }

        /* دڵی جووڵاو کە بەرەو سەرەوە دەچن */
        .heart-bg {
            position: absolute;
            bottom: -20px;
            color: rgba(233, 30, 99, 0.2);
            font-size: 24px;
            animation: floatUp 6s linear infinite;
            z-index: 0;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1.5);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 8px 30px rgba(233, 30, 99, 0.15);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid #f8bbd0;
        }
        .hidden { display: none; }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: right;
            font-family: Tahoma, sans-serif;
            background: #fff;
        }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover { background: #d81b60; }
        .secondary-btn {
            background: #607d8b;
            margin-top: 8px;
        }
        .secondary-btn:hover { background: #546e7a; }
        .countdown-box {
            display: flex;
            justify-content: space-around;
            background: #fff0f3;
            padding: 15px;
            border-radius: 12px;
            margin: 15px 0;
            border: 1px solid #ffccd5;
        }
        .time-item {
            font-size: 13px;
            font-weight: bold;
            color: #666;
        }
        .time-item span {
            display: block;
            font-size: 18px;
            color: #e91e63;
        }
        .question-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .question-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #444;
        }
    </style>
</head>
<body>

    <!-- دڵەکان کە بە شێوەی خۆکارانە بەرەو سەرەوە دەچن -->
    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-bg');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 3) + 's';
            document.body.appendChild(heart);
            setTimeout(() => {
                heart.remove();
            }, 6000);
        }
        setInterval(createHeart, 400);
    </script>

    <!-- ١. پەڕەی چوونەژوورەوە -->
    <div class="container" id="login-section">
        <h2>چوونەژوورەوە</h2>
        <label style="text-align: right; display: block; margin-top: 10px;">ئەم لینکەت لە کوێ بۆت هات؟</label>
        <select id="source">
            <option value="Snapchat">سناپچات</option>
            <option value="TikTok">تیکتۆک</option>
            <option value="Instagram">ئینستاگرام</option>
        </select>

        <input type="text" id="username" placeholder="ناوی خۆت">
        <input type="password" id="password" placeholder="پاسۆرد">
        <input type="text" id="sender" placeholder="ناوی خۆشەویستەکەت (لەلایەن کێوە بۆت هات؟)">

        <button onclick="goToDateSection()">بەردەوامبوون</button>
    </div>

    <!-- ٢. پەڕەی تۆمارکردنی بەروار -->
    <div class="container hidden" id="date-section">
        <h2>بەرواری یەکترناسین</h2>
        <p style="font-size: 14px; color: #666;">تکایە بەرواری یەکترناسینەکەتان تۆمار بکە:</p>
        <input type="datetime-local" id="relation-date">
        <button onclick="saveDateAndGoHome()">تۆمارکردن و چووە ناو وێبسایت</button>
    </div>

    <!-- ٣. داشبۆردی سەرەکی -->
    <div class="container hidden" id="main-dashboard">
        <h2 id="couple-names-title" style="color: #e91e63;">🤍 خۆشەویستی 🤍</h2>
        
        <div class="countdown-box">
            <div class="time-item"><span id="days">0</span>ڕۆژ</div>
            <div class="time-item"><span id="hours">0</span>کاتژمێر</div>
            <div class="time-item"><span id="minutes">0</span>خولەک</div>
            <div class="time-item"><span id="seconds">0</span>چرکە</div>
        </div>

        <button onclick="showSection('questions-section')">پرسیارە تایبەتەکان</button>
        <button onclick="showSection('wishes-section')" class="secondary-btn">بەشی داواکارییەکان</button>
    </div>

    <!-- ٤. بەشی پرسیارەکان -->
    <div class="container hidden" id="questions-section">
        <h3>پرسیارە تایبەتەکان</h3>
        
        <div class="question-group">
            <label>١. ناوی ئەو کەسەی دەنگی بەلایەوە خۆشە (شاعیر یان هونەرمەند)؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>٢. ئەو خواردنەی حەزی لێیە؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>٣. بەچی دڵی ئەشکێت؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>٤. بە چی ئاشت ئەبێتەوە؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <button onclick="alert('وەڵامەکانت پاشەکەوت کران!')">ناردنی وەڵامەکان</button>
        <button onclick="showSection('main-dashboard')" class="secondary-btn">گەڕانەوە بۆ دواوە</button>
    </div>

    <!-- ٥. بەشی داواکارییەکان -->
    <div class="container hidden" id="wishes-section">
        <h3>بەشی داواکارییەکان</h3>
        <p style="font-size: 13px; color: #666; text-align: right;">هەرچییەکت دەوێت لێرە بینووسە بۆ خۆشەویستەکەت:</p>
        
        <div class="question-group">
            <label>داواکارییەکەت بنووسە:</label>
            <textarea rows="4" placeholder="نامە یان داواکارییەکەت لێرە بنووسە..."></textarea>
        </div>

        <button onclick="alert('داواکارییەکەت بە سەرکەوتوویی نێردرا!')">ناردنی داواکاری</button>
        <button onclick="showSection('main-dashboard')" class="secondary-btn">گەڕانەوە بۆ دواوە</button>
    </div>

    <script>
        let startDate;

        function goToDateSection() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const sender = document.getElementById('sender').value;
            
            if(!user || !pass || !sender) {
                alert('تکایە هەموو خانەکان پڕبکەرەوە');
                return;
            }

            document.getElementById('couple-names-title').innerText = `🤍 ${user} & ${sender} 🤍`;

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('date-section').classList.remove('hidden');
        }

        function saveDateAndGoHome() {
            const dateInput = document.getElementById('relation-date').value;
            if(!dateInput) {
                alert('تکایە بەروار دیاری بکە');
                return;
            }
            startDate = new Date(dateInput).getTime();
            document.getElementById('date-section').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');

            setInterval(updateCountdown, 1000);
        }

        function showSection(sectionId) {
            document.getElementById('main-dashboard').classList.add('hidden');
            document.getElementById('questions-section').classList.add('hidden');
            document.getElementById('wishes-section').classList.add('hidden');

            document.getElementById(sectionId).classList.remove('hidden');
        }

        function updateCountdown() {
            if (!startDate) return;
            const now = new Date().getTime();
            const distance = now - startDate;

            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }
    </script>
</body>
</html>
