<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ئەوینی و ئەمینی</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #4a154b;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        .hidden { display: none; }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            text-align: right;
        }
        button {
            background: #d81b60;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background: #c2185b; }
        .countdown-box {
            display: flex;
            justify-content: space-around;
            background: #fdf2f4;
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
        }
        .time-item {
            font-size: 14px;
            font-weight: bold;
            color: #ad1457;
        }
        .time-item span {
            display: block;
            font-size: 20px;
            color: #880e4f;
        }
        .question-group {
            text-align: right;
            margin-bottom: 15px;
        }
        .question-group label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container" id="login-section">
        <h2>چوونەژوورەوە</h2>
        <label>ئەم لینکەت لە کوێ بۆت هات؟</label>
        <select id="source">
            <option value="Snapchat">سناپچات</option>
            <option value="TikTok">تیکتۆک</option>
            <option value="Instagram">ئینستاگرام</option>
        </select>

        <input type="text" id="username" placeholder="ناوی خۆت">
        <input type="password" id="password" placeholder="پاسۆرد">
        <input type="text" id="sender" placeholder="لەلایەن کێوە بۆت هات؟ (یوزەرنەیم)">

        <button onclick="goToDateSection()">ردەوامبوون</button>
    </div>

    <div class="container hidden" id="date-section">
        <h2>بەرواری یەکترناسین</h2>
        <p>تکایە بەرواری یەکترناسینەکەتان تۆمار بکە بۆ هەژمارکردنی کات:</p>
        <input type="datetime-local" id="relation-date">
        <button onclick="startApp()">دەستپێکردن</button>
    </div>

    <div class="container hidden" id="main-section">
        <h2>❤ ئەوینی و ئەمینی ❤</h2>
        
        <div class="countdown-box">
            <div class="time-item"><span id="days">0</span>ڕۆژ</div>
            <div class="time-item"><span id="hours">0</span>کاتژمێر</div>
            <div class="time-item"><span id="minutes">0</span>خولەک</div>
            <div class="time-item"><span id="seconds">0</span>چرکە</div>
        </div>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

        <h3>پرسیارە تایبەتەکان</h3>
        
        <div class="question-group">
            <label>1. ناوی ئەو کەسەی دەنگی بەلایەوە خۆشە (شاعیر یان هونەرمەند)؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>2. ئەو خواردنەی حەزی لێیە؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>3. کەی خۆشتویست لە ناخی دڵتەوە؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>4. کەی زۆر ڕقت لێبوو؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>5. بەچی دڵی ئەشکێت؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <div class="question-group">
            <label>6. بە چی ئاشت ئەبێتەوە؟</label>
            <input type="text" placeholder="وەڵامەکەت بنووسە...">
        </div>

        <button onclick="alert('وەڵامەکانت بە سەرکەوتوویی پاشەکەوت کران!')">ناردنی وەڵامەکان</button>
    </div>

    <script>
        let startDate;

        function goToDateSection() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if(!user || !pass) {
                alert('تکایە ناو و پاسۆرد بنووسە');
                return;
            }
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('date-section').classList.remove('hidden');
        }

        function startApp() {
            const dateInput = document.getElementById('relation-date').value;
            if(!dateInput) {
                alert('تکایە بەروار دیاری بکە');
                return;
            }
            startDate = new Date(dateInput).getTime();
            document.getElementById('date-section').classList.add('hidden');
            document.getElementById('main-section').classList.remove('hidden');

            setInterval(updateCountdown, 1000);
        }

        function updateCountdown() {
            const now = new Date().getTime();
            const distance = now - startDate;

            if (distance < 0) return;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = days;
            document.getElementById('hours').innerText = hours;
            document.getElementById('minutes').innerText = minutes;
            document.getElementById('seconds').innerText = seconds;
        }
    </script>
</body>
</html>
